name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build & Release (ad-hoc signed)
    runs-on: macos-latest
    env:
      APP_NAME: TRClick
      SCHEME: TRClick
      PROJECT: TRClick.xcodeproj
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Get Version from Tag
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Will release version: $VERSION"

      - name: Build Release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          BUILD_NUMBER="$(date +%Y%m%d%H%M)"
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -derivedDataPath build \
            -destination "generic/platform=macOS" \
            ARCHS=arm64 \
            MACOSX_DEPLOYMENT_TARGET=15.6 \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$VERSION" \
            | tee build-release.log

          APP_PATH=$(find build -name "${APP_NAME}.app" -type d -path "*/Products/Release/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: App not found in build output"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built app at: $APP_PATH"
          lipo -info "$APP_PATH/Contents/MacOS/${APP_NAME}" || true

      # 自用版没有证书，用 ad-hoc 签名（codesign -s -）。
      # 扩展必须带 app-sandbox，否则 pkd 会拒绝加载；主 App 不沙盒、不写 entitlements。
      - name: Ad-hoc Sign
        run: |
          set -euo pipefail

          APPEX_PATH="$APP_PATH/Contents/PlugIns/FinderSyncExt.appex"
          if [ ! -d "$APPEX_PATH" ]; then
            echo "Error: FinderSync extension not found at $APPEX_PATH"
            exit 1
          fi

          # 先签内层扩展（带 sandbox entitlements）
          codesign --force --sign - \
            --entitlements FinderSyncExt/FinderSyncExt.entitlements \
            "$APPEX_PATH"

          # 再签外层主 App（不沙盒，因此不传 entitlements）
          codesign --force --sign - "$APP_PATH"

          codesign --verify --strict --verbose=2 "$APPEX_PATH"
          codesign --verify --strict --verbose=2 "$APP_PATH"

          APPEX_ENTITLEMENTS=$(codesign -d --entitlements - "$APPEX_PATH" 2>&1 || true)
          printf '%s\n' "$APPEX_ENTITLEMENTS"
          if ! grep -Fq "com.apple.security.app-sandbox" <<< "$APPEX_ENTITLEMENTS"; then
            echo "Error: FinderSync extension is missing app-sandbox"
            exit 1
          fi

          APP_ENTITLEMENTS=$(codesign -d --entitlements - "$APP_PATH" 2>&1 || true)
          printf '%s\n' "$APP_ENTITLEMENTS"
          if grep -Fq "com.apple.security.app-sandbox" <<< "$APP_ENTITLEMENTS"; then
            echo "Error: main app must not be sandboxed"
            exit 1
          fi

      # 自动更新器按 ".app.zip" 后缀找资产，DMG 只用于手动安装。
      - name: Create App ZIP
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP_NAME="${APP_NAME}-v${VERSION}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" "$ZIP_NAME"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"
          ls -lh "$ZIP_NAME"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create DMG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          DMG_NAME="${APP_NAME}-v${VERSION}.dmg"

          DMG_STAGING="dmg-staging"
          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"
          ditto "$APP_PATH" "$DMG_STAGING/${APP_NAME}.app"

          create-dmg \
            --volname "${APP_NAME}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "${APP_NAME}.app" 150 200 \
            --hide-extension "${APP_NAME}.app" \
            --app-drop-link 450 200 \
            "$DMG_NAME" \
            "$DMG_STAGING/${APP_NAME}.app"

          rm -rf "$DMG_STAGING"

          echo "DMG_NAME=$DMG_NAME" >> "$GITHUB_ENV"
          ls -lh "$DMG_NAME"

      - name: Create Checksums
        run: |
          set -euo pipefail
          CHECKSUMS="${APP_NAME}-v${{ steps.version.outputs.version }}.sha256"
          shasum -a 256 "$ZIP_NAME" "$DMG_NAME" | tee "$CHECKSUMS"
          echo "CHECKSUMS=$CHECKSUMS" >> "$GITHUB_ENV"

      # 先准备草稿和附件，清单上传完成后再公开，避免 latest 指向缺少清单的版本。
      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.DMG_NAME }}
            ${{ env.CHECKSUMS }}
          generate_release_notes: true
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Update Manifest and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.release.outputs.id }}
        run: |
          set -euo pipefail
          # 草稿元数据的页面和附件链接可能含 untagged-*，公开后会失效。
          # 用本次构建的正式标签生成永久链接，保留其余发布元数据。
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            | jq --arg base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases" \
                 --arg tag "$GITHUB_REF_NAME" '
                .draft = false
                | .published_at = (now | todate)
                | .html_url = ($base + "/tag/" + ($tag | @uri))
                | .assets |= map(.browser_download_url =
                    ($base + "/download/" + ($tag | @uri) + "/" + (.name | @uri)))
              ' > update.json
          gh release upload "$GITHUB_REF_NAME" update.json --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TRClick-v${{ steps.version.outputs.version }}
          path: |
            ${{ env.ZIP_NAME }}
            ${{ env.DMG_NAME }}
            ${{ env.CHECKSUMS }}
            update.json
          if-no-files-found: error
