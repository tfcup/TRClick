name: Repair v0.1.6 Update Manifest

on:
  push:
    branches: [main]
    paths: [.github/workflows/repair-update-manifest.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Repair and verify the published manifest
        run: |
          set -euo pipefail
          gh release download v0.1.6 --pattern update.json --repo "$GITHUB_REPOSITORY"
          mv update.json previous.json
          jq -e '.tag_name == "v0.1.6" and .draft == false' previous.json > /dev/null
          jq --arg base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases" --arg tag v0.1.6 '
            .html_url = ($base + "/tag/" + ($tag | @uri))
            | .assets |= map(.browser_download_url =
                ($base + "/download/" + ($tag | @uri) + "/" + (.name | @uri)))
          ' previous.json > update.json
          while IFS= read -r url; do
            curl --fail --head --location --silent --show-error --output /dev/null "$url"
          done < <(jq -r '.assets[].browser_download_url' update.json)
          gh release upload v0.1.6 update.json --repo "$GITHUB_REPOSITORY" --clobber
          curl --fail --location --silent --show-error --header 'Cache-Control: no-cache' \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v0.1.6/update.json" \
            --output published.json
          jq -e --arg base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases" '
            .tag_name == "v0.1.6"
            and .html_url == ($base + "/tag/v0.1.6")
            and (.assets | all(.browser_download_url | startswith($base + "/download/v0.1.6/")))
          ' published.json > /dev/null
